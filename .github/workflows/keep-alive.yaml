name: Keep Supabase Alive

on:
  schedule:
    # Proti 3 din por por rat 12-tay auto run hobe
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Chaile manual-o trigger korte parben

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/${{ secrets.SUPABASE_TABLE_NAME }}?select=*&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"