version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: educationos_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
    networks:
      - educationos_net
    expose:
      - "8000"

  rag_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: educationos_rag_worker
    restart: unless-stopped
    command: python -m app.workers.rag_worker
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
    networks:
      - educationos_net
    depends_on:
      - backend

  outbox_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: educationos_outbox_worker
    restart: unless-stopped
    command: python -m app.workers.outbox_worker
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
    networks:
      - educationos_net
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: educationos_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - educationos_net
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: educationos_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    networks:
      - educationos_net
    depends_on:
      - backend
      - frontend

  certbot:
    image: certbot/certbot
    container_name: educationos_certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"

networks:
  educationos_net:
    driver: bridge